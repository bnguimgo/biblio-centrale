spring.application.name=biblio-centrale
server.servlet.context-path=/bibliocentrale
server.port=8094

#DATABASE CONFIG

# Custom H2 Console URL
spring.h2.console.enabled=true
spring.h2.console.path=/h2
#Acces à la console BDD H2: http://localhost:8094/bibliocentrale/h2/

#spring.datasource.url=jdbc:h2:mem:bibliocentrale_db
