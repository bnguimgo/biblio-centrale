# MYSQL DATABASE
spring.datasource.url= jdbc:mysql://localhost:3309/bibliocentrale_db?allowPublicKeyRetrieval=true&useSSL=false
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username= root
spring.datasource.password= Admin123*

#org.hibernate.orm.deprecation --> On n'a plus besoin de spécifier explicitement le dialect, car c'est choisi par défaut par Spring
#spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
#spring.jpa.database-platform= org.hibernate.dialect.MySQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Gestion des logs
#Source: https://www.baeldung.com/sql-logging-spring-boot

#logs the SQL queries
logging.level.org.hibernate.SQL=DEBUG
#logs the prepared statement parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#Permet d'afficher les paramètres d'une requête sql
logging.level.org.hibernate.orm.jdbc.bind=TRACE


